<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - SkillBridge</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="style.css">

<script src="auth.js"></script>
</head>

<body class="auth-page">

<div class="auth-wrapper">

    <div class="auth-brand">

        <div class="auth-logo">
            Skill<span>Bridge</span>
        </div>

        <h1>
            Connecting Talent
            <br>
            with <span>Opportunities</span>
        </h1>

        <p>
            Build skills. Discover opportunities.
            Connect with industry.
        </p>

        <div class="auth-illustration">
            <i class="bi bi-people-fill"></i>
        </div>

    </div>


    <div class="auth-form-area">

        <div class="auth-box">

            <div class="text-center mb-4">

                <div class="auth-icon">
                    <i class="bi bi-person"></i>
                </div>

                <h2>Welcome Back!</h2>

                <p>
                    Login to your SkillBridge account
                </p>

            </div>


            <form onsubmit="handleLogin(event)">

                <label>Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required>


                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required>


                <button type="submit" class="btn btn-purple w-100 mt-4">
                    Login
                    <i class="bi bi-arrow-right"></i>
                </button>

            </form>


            <div class="divider">
                <span>OR</span>
            </div>


            <p class="text-center">

                Don't have an account?

                <a href="signin.html">
                    Create Account
                </a>

            </p>


            <a href="index.html" class="back-link">
                ← Back to Home
            </a>

        </div>

    </div>

</div>

<script>
function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;

    if (!email || !password) {
        alert("Please enter email and password.");
        return;
    }

    const users = getUsers();
    const user = users.find(u => u.email.toLowerCase() === email && u.password === password);

    if (!user) {
        alert("Invalid email or password.");
        return;
    }

    setCurrentUser(user);

    const role = (user.role || "student").toLowerCase();
    if (role === "academician") {
        window.location.href = "academician-dashboard.html";
    } else if (role === "industry") {
        window.location.href = "industry-dashboard.html";
    } else {
        window.location.href = "dashboard.html";
    }
}
</script>
<script src="script.js"></script>

</body>
</html>
